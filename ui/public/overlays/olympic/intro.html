<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reStrike VTA - Olympic Player Introduction</title>
    <link rel="stylesheet" href="/assets/fonts/fonts.css">
    <link rel="stylesheet" href="intro.css">
</head>
<body>
    <div id="connection-status" class="connection-status"></div>
    <div id="overlay-container">
        <object id="overlay-svg" data="/assets/scoreboard/olympic/olympic_players_overlay.svg" type="image/svg+xml">
            <div class="fallback-loading">Player Introduction Overlay Loading...</div>
        </object>
    </div>

    <script src="/assets/scoreboard/scoreboard-name-utils.js"></script>
    <script src="/assets/scoreboard/scoreboard-font-injector.js"></script>
    <script src="/assets/scoreboard/scoreboard-utils.js"></script>
    <script src="/assets/scoreboard/scoreboard-core.js"></script>
    <script>
        const olympicIntroCore = new window.ScoreboardCore();
        let olympicIntroOverlay = null;

        function updateConnectionStatus(connected) {
            const el = document.getElementById('connection-status');
            if (!el) return;
            el.classList.toggle('connected', Boolean(connected));
        }

        function applyState(state) {
            if (!olympicIntroOverlay || !state || !state.match || !state.match.athletes) {
                return;
            }
            const blue = state.match.athletes.blue || {};
            const red = state.match.athletes.red || {};

            const blueName = blue.long || blue.short || '';
            const redName = red.long || red.short || '';

            if (blueName) olympicIntroOverlay.updatePlayer1Name(blueName);
            if (redName) olympicIntroOverlay.updatePlayer2Name(redName);
            if (blue.country) olympicIntroOverlay.updatePlayer1Flag(blue.country);
            if (red.country) olympicIntroOverlay.updatePlayer2Flag(red.country);
        }

        function initializeOverlay() {
            if (olympicIntroOverlay) return;
            const svgObject = document.getElementById('overlay-svg');
            const svgDoc = svgObject.contentDocument || svgObject.contentWindow?.document;
            const svg = svgDoc?.querySelector('svg');

            if (!svg || typeof PlayerIntroductionOverlay === 'undefined') {
                setTimeout(initializeOverlay, 250);
                return;
            }

            olympicIntroOverlay = new PlayerIntroductionOverlay(svg);
            applyState(olympicIntroCore.getState());
        }

        olympicIntroCore.on('state', applyState);
        olympicIntroCore.on('connection', ({ connected }) => updateConnectionStatus(connected));

        document.addEventListener('DOMContentLoaded', () => {
            const o = document.getElementById('overlay-svg');
            if (window.ScoreboardFontInjector) {
                window.ScoreboardFontInjector.initForObject('#overlay-svg');
            }
            o.addEventListener('load', initializeOverlay);
            if (o.contentDocument) {
                initializeOverlay();
            }
        });
    </script>
</body>
</html>
