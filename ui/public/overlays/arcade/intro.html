<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reStrike VTA - Arcade Player Introduction</title>
    <link rel="stylesheet" href="/assets/fonts/fonts.css">
    <link rel="stylesheet" href="./intro.css">
</head>
<body>
    <div id="connection-status" class="connection-status"></div>
    <div id="overlay-container">
        <object id="overlay-svg" data="/assets/scoreboard/arcade/arcade_players_overlay.svg" type="image/svg+xml">
            <div class="loading-fallback">Player Introduction Overlay Loading...</div>
        </object>
    </div>
    <script src="/assets/scoreboard/scoreboard-name-utils.js"></script>
    <script src="/assets/scoreboard/scoreboard-font-injector.js"></script>
    <script src="/assets/scoreboard/scoreboard-utils.js"></script>
    <script src="/assets/scoreboard/scoreboard-core.js"></script>
    <script>
        const arcadeIntroCore = new window.ScoreboardCore();
        let arcadeIntroOverlay = null;

        function updateConnectionStatus(connected) {
            const e = document.getElementById('connection-status');
            if (!e) return;
            e.classList.toggle('connected', Boolean(connected));
        }

        function applyState(state) {
            if (!arcadeIntroOverlay || !state || !state.match || !state.match.athletes) {
                return;
            }
            const blue = state.match.athletes.blue || {};
            const red = state.match.athletes.red || {};

            const blueName = blue.long || blue.short || '';
            const redName = red.long || red.short || '';

            if (blueName) arcadeIntroOverlay.updateAthleteName('blue', blueName);
            if (redName) arcadeIntroOverlay.updateAthleteName('red', redName);
            if (blue.country) arcadeIntroOverlay.updateAthleteFlag('blue', blue.country);
            if (red.country) arcadeIntroOverlay.updateAthleteFlag('red', red.country);
        }

        function initialize() {
            if (arcadeIntroOverlay) return;
            const o = document.getElementById('overlay-svg');
            const d = o?.contentDocument || o?.contentWindow?.document;
            const svg = d?.querySelector('svg');

            if (!svg || typeof PlayerIntroductionOverlay === 'undefined') {
                setTimeout(initialize, 250);
                return;
            }

            arcadeIntroOverlay = new PlayerIntroductionOverlay(svg);
            applyState(arcadeIntroCore.getState());
        }

        arcadeIntroCore.on('state', applyState);
        arcadeIntroCore.on('connection', ({ connected }) => updateConnectionStatus(connected));

        document.addEventListener('DOMContentLoaded', () => {
            const o = document.getElementById('overlay-svg');
            if (window.ScoreboardFontInjector) {
                window.ScoreboardFontInjector.initForObject('#overlay-svg');
            }
            o.addEventListener('load', initialize);
            if (o.contentDocument) {
                initialize();
            }
        });
    </script>
</body>
</html>
