<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>reStrike VTA - Modern Winner Overlay</title>
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <link rel="stylesheet" href="/overlays/modern/scoreboard.css">
</head>
<body data-tauri-drag-region>
  <div id="connection-status" class="connection-status"></div>
  <div id="scoreboard-container">
    <object id="scoreboard-svg" data="/assets/scoreboard/modern/modern_winner_overlay.svg" type="image/svg+xml">
      <div class="scoreboard-fallback">Winner Overlay Loading...</div>
    </object>
  </div>

  <script src="/assets/scoreboard/scoreboard-name-utils.js"></script>
  <script src="/assets/scoreboard/scoreboard-font-injector.js"></script>
  <script src="/assets/scoreboard/scoreboard-utils.js"></script>
  <script src="/assets/scoreboard/scoreboard-core.js"></script>
  <script>
    const modernWinnerCore = new window.ScoreboardCore();
    let modernWinnerOverlay = null;

    function modernWinnerSetConnectionStatus(connected) {
      const indicator = document.getElementById('connection-status');
      if (!indicator) return;
      indicator.classList.toggle('connected', Boolean(connected));
    }

    function modernWinnerInitOverlay() {
      if (modernWinnerOverlay) return;
      const obj = document.getElementById('scoreboard-svg');
      const doc = obj?.contentDocument || obj?.contentWindow?.document;
      const svg = doc?.querySelector('svg');
      if (!svg || typeof ScoreboardOverlay === 'undefined') {
        setTimeout(modernWinnerInitOverlay, 250);
        return;
      }

      modernWinnerOverlay = new ScoreboardOverlay(svg);
      modernWinnerApplyState(modernWinnerCore.getState());
    }

    function modernWinnerComputeWinner(state) {
      const scores = state?.scores;
      const rounds = state?.rounds;
      const winners = rounds?.winners || [];
      const blueWins = winners.filter((v) => v === 1).length;
      const redWins = winners.filter((v) => v === 2).length;

      let winnerSide = 0;
      if (blueWins > redWins) {
        winnerSide = 1;
      } else if (redWins > blueWins) {
        winnerSide = 2;
      } else {
        const blueScore = scores?.current?.blue ?? 0;
        const redScore = scores?.current?.red ?? 0;
        if (blueScore > redScore) winnerSide = 1;
        else if (redScore > blueScore) winnerSide = 2;
      }

      return { winnerSide, blueWins, redWins };
    }

    function modernWinnerApplyState(state) {
      if (!modernWinnerOverlay || !state) return;
      const { match } = state;
      const { winnerSide, blueWins, redWins } = modernWinnerComputeWinner(state);
      if (!winnerSide || !match?.athletes) return;

      const athlete =
        winnerSide === 1 ? match.athletes.blue : match.athletes.red;
      if (!athlete) return;

      const nameRaw = athlete.long || athlete.short || '';
      const name = nameRaw ? nameRaw.toUpperCase() : '';
      const country = (athlete.country || '').toUpperCase();

      const nameEl = modernWinnerOverlay.getSvgElementAny(['athleteName']);
      if (nameEl && name) {
        modernWinnerOverlay.setTextForElementOrGroup(nameEl, name);
      }

      const countryEl = modernWinnerOverlay.getSvgElementAny(['athleteCountry']);
      if (countryEl && country) {
        modernWinnerOverlay.setTextForElementOrGroup(countryEl, country);
      }

      if (country) {
        modernWinnerOverlay.setFlagForElementCandidates(
          ['athleteFlag', 'athkleteFlagPlaceholder'],
          country,
        );
      }

      const phaseEl = modernWinnerOverlay.getSvgElementAny(['modernPhase']);
      if (phaseEl) {
        const roundSummary = `${blueWins}-${redWins}`;
        const matchNoRaw = match.number ? String(match.number).trim() : '';
        const labelParts = ['MATCH RESULT'];
        if (matchNoRaw) labelParts.push(`MATCH #${matchNoRaw}`);
        labelParts.push(`ROUNDS ${roundSummary}`);
        modernWinnerOverlay.setTextForElementOrGroup(
          phaseEl,
          labelParts.join(' • '),
        );
      }
    }

    modernWinnerCore.on('state', (state) => {
      modernWinnerApplyState(state);
    });

    modernWinnerCore.on('connection', ({ connected }) =>
      modernWinnerSetConnectionStatus(connected),
    );

    document.addEventListener('DOMContentLoaded', () => {
      const obj = document.getElementById('scoreboard-svg');
      if (window.ScoreboardFontInjector) {
        window.ScoreboardFontInjector.initForObject('#scoreboard-svg');
      }
      obj?.addEventListener('load', modernWinnerInitOverlay);
      if (obj?.contentDocument) {
        modernWinnerInitOverlay();
      }
    });

    window.ModernWinnerOverlay = {
      core: modernWinnerCore,
      applyState: modernWinnerApplyState,
    };
  </script>
</body>
</html>
