<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reStrike VTA - Modern Player Introduction</title>
    <link rel="stylesheet" href="/assets/fonts/fonts.css">
    <link rel="stylesheet" href="/overlays/modern/intro.css">
</head>
<body>
    <div id="connection-status" class="connection-status"></div>
    <div id="overlay-container">
        <object id="overlay-svg" data="/assets/scoreboard/modern/modern_players_overlay.svg" type="image/svg+xml">
            <div class="overlay-fallback">Player Introduction Overlay Loading...</div>
        </object>
    </div>

    <script src="/assets/scoreboard/scoreboard-name-utils.js"></script>
    <script src="/assets/scoreboard/scoreboard-font-injector.js"></script>
    <script src="/assets/scoreboard/scoreboard-utils.js"></script>
    <script src="/assets/scoreboard/scoreboard-core.js"></script>
    <script>
        const modernIntroCore = new window.ScoreboardCore();
        let modernIntroOverlay = null;

        function updateConnectionStatus(connected) {
            const el = document.getElementById('connection-status');
            if (!el) return;
            el.classList.toggle('connected', Boolean(connected));
        }

        function applyState(state) {
            if (!modernIntroOverlay || !state || !state.match || !state.match.athletes) {
                return;
            }
            const blue = state.match.athletes.blue || {};
            const red = state.match.athletes.red || {};

            const blueName = blue.long || blue.short || '';
            const redName = red.long || red.short || '';

            if (blueName) modernIntroOverlay.updateAthleteName('blue', blueName);
            if (redName) modernIntroOverlay.updateAthleteName('red', redName);
            if (blue.country) modernIntroOverlay.updateAthleteFlag('blue', blue.country);
            if (red.country) modernIntroOverlay.updateAthleteFlag('red', red.country);
        }

        function initializeOverlay() {
            if (modernIntroOverlay) return;
            const obj = document.getElementById('overlay-svg');
            const doc = obj?.contentDocument || obj?.contentWindow?.document;
            const svg = doc?.querySelector('svg');

            if (!svg || typeof PlayerIntroductionOverlay === 'undefined') {
                setTimeout(initializeOverlay, 250);
                return;
            }

            modernIntroOverlay = new PlayerIntroductionOverlay(svg);
            applyState(modernIntroCore.getState());
        }

        modernIntroCore.on('state', applyState);
        modernIntroCore.on('connection', ({ connected }) => updateConnectionStatus(connected));

        document.addEventListener('DOMContentLoaded', () => {
            const obj = document.getElementById('overlay-svg');
            if (window.ScoreboardFontInjector) {
                window.ScoreboardFontInjector.initForObject('#overlay-svg');
            }
            obj?.addEventListener('load', initializeOverlay);
            if (obj?.contentDocument) {
                initializeOverlay();
            }
        });
    </script>
</body>
</html>
