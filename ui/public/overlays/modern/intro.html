<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reStrike VTA - Modern Player Introduction</title>
    <link rel="stylesheet" href="/assets/fonts/fonts.css">
    <link rel="stylesheet" href="/overlays/modern/intro.css">
</head>
<body>
    <div id="connection-status" class="connection-status"></div>
    <div id="overlay-container">
        <object id="overlay-svg" data="/assets/scoreboard/modern/modern_players_overlay.svg" type="image/svg+xml">
            <div class="overlay-fallback">Player Introduction Overlay Loading...</div>
        </object>
    </div>

    <script src="/assets/scoreboard/scoreboard-utils.js"></script>
    <script>
        let overlayInstance=null;
        function updateConnectionStatus(c){const e=document.getElementById('connection-status'); if(c)e.classList.add('connected'); else e.classList.remove('connected');}
        function initialize(){ const o=document.getElementById('overlay-svg'); const d=o.contentDocument||o.contentWindow?.document; if(d&&d.querySelector('svg')){ try{ overlayInstance=new PlayerIntroductionOverlay(d.querySelector('svg')); updateConnectionStatus(false);}catch(_){ setTimeout(initialize,1000);} } else { setTimeout(initialize,1000);} }
        function handle(e){ if(!overlayInstance) return; if(e.type==='athletes'){ if(e.athlete1_long) overlayInstance.updatePlayer1Name(e.athlete1_long); if(e.athlete2_long) overlayInstance.updatePlayer2Name(e.athlete2_long); if(e.athlete1_country) overlayInstance.updatePlayer1Flag(e.athlete1_country); if(e.athlete2_country) overlayInstance.updatePlayer2Flag(e.athlete2_country);} }
        function forwardPayload(payload){ if(!payload) return; const evt=(payload.type==='pss_event'&&payload.data)?payload.data:(payload.detail??payload); if(evt) handle(evt); }
        let ws=null, tries=0; const max=5, delay=2000; function connect(){ try{ const h=window.location.hostname; const w=(h==='localhost'||h==='127.0.0.1')?'127.0.0.1':h; const url=`ws://${w}:3001`; ws=new WebSocket(url); ws.onopen=()=>{updateConnectionStatus(true); tries=0;}; ws.onmessage=(ev)=>{ try{ const d=JSON.parse(ev.data); forwardPayload(d);}catch(_){}}; ws.onclose=()=>{updateConnectionStatus(false); if(tries<max){tries++; setTimeout(connect,delay);} }; ws.onerror=()=>updateConnectionStatus(false);}catch(_){updateConnectionStatus(false);} }
        function attachFallback(){ window.addEventListener('pss-event',(evt)=>{ if(evt?.detail) forwardPayload(evt); }); window.addEventListener('storage',(evt)=>{ if(evt.key!=='pss_event'||!evt.newValue) return; try{ const parsed=JSON.parse(evt.newValue); forwardPayload(parsed);}catch(_){}}); }
        document.addEventListener('DOMContentLoaded',()=>{ const o=document.getElementById('overlay-svg'); o.addEventListener('load', initialize); connect(); attachFallback(); if(o.contentDocument) initialize();});
        window.ModernIntro={handle: forwardPayload};
    </script>
</body>
</html>
