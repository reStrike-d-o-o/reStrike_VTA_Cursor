<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reStrike VTA - Modern Scoreboard Overlay</title>
    <link rel="stylesheet" href="/assets/fonts/fonts.css">
    <link rel="stylesheet" href="/overlays/modern/scoreboard.css">
</head>

<body>
    <div id="connection-status" class="connection-status"></div>
    <div id="scoreboard-container">
        <object id="scoreboard-svg" data="/assets/scoreboard/modern/modern_scoreboard.svg" type="image/svg+xml">
            <div class="scoreboard-fallback">Scoreboard Overlay Loading...</div>
        </object>
    </div>

    <script src="/assets/scoreboard/scoreboard-name-utils.js"></script>
    <script src="/assets/scoreboard/scoreboard-font-injector.js"></script>
    <script src="/assets/scoreboard/scoreboard-utils.js"></script>
    <script>
        const RETRY_DELAY_MS = 2000;
        const MAX_RETRIES = 5;
        let scoreboardInstance = null;
        let roundDuration = 120;
        let ws = null;
        let retryCount = 0;

        function updateConnectionStatus(connected) {
            const el = document.getElementById('connection-status');
            if (!el) return;
            if (connected) {
                el.classList.add('connected');
            } else {
                el.classList.remove('connected');
            }
        }

        function resolveWebSocketUrl() {
            try {
                const params = new URLSearchParams(window.location.search);
                const explicitUrl = params.get('wsUrl');
                if (explicitUrl) {
                    return explicitUrl;
                }

                const protocol = window.location.protocol;
                let host = params.get('wsHost') || window.location.hostname || '127.0.0.1';
                if (host === 'localhost' || protocol !== 'http:' && protocol !== 'https:') {
                    host = '127.0.0.1';
                }
                const port = params.get('wsPort') || '3001';
                const wsProtocol = protocol === 'https:' ? 'wss' : 'ws';
                return `${wsProtocol}://${host}:${port}`;
            } catch (_error) {
                return 'ws://127.0.0.1:3001';
            }
        }

        function initialize() {
            const obj = document.getElementById('scoreboard-svg');
            const doc = obj?.contentDocument || obj?.contentWindow?.document;
            const svg = doc?.querySelector('svg');
            if (!svg) {
                setTimeout(initialize, 500);
                return;
            }

            if (typeof ScoreboardOverlay === 'undefined') {
                setTimeout(initialize, 500);
                return;
            }

            scoreboardInstance = new ScoreboardOverlay(svg);
            updateConnectionStatus(false);
        }

        function parseTime(value) {
            if (!value) {
                return { minutes: 0, seconds: 0 };
            }
            if (value.includes(':')) {
                const parts = value.split(':');
                const minutes = parseInt(parts[0] ?? '0', 10) || 0;
                const seconds = parseInt(parts[1] ?? '0', 10) || 0;
                return { minutes, seconds };
            }
            const totalSeconds = parseInt(value, 10) || 0;
            return {
                minutes: Math.floor(totalSeconds / 60),
                seconds: totalSeconds % 60,
            };
        }

        function parseMaybeJson(value) {
            if (typeof value !== 'string') {
                return null;
            }
            try {
                return JSON.parse(value);
            } catch (_error) {
                return null;
            }
        }

        function handle(event) {
            if (!scoreboardInstance || !event) return;

            const payload = event.data && typeof event.data === 'object' ? event.data : event;
            const eventType = typeof payload.type === 'string'
                ? payload.type
                : typeof payload.event_type === 'string'
                    ? payload.event_type
                    : '';

            switch (eventType) {
                case 'athletes': {
                    const blue = payload.athlete1 || payload.blue || {};
                    const red = payload.athlete2 || payload.red || {};
                    if (blue.long) scoreboardInstance.updatePlayerName('blue', blue.long);
                    if (red.long) scoreboardInstance.updatePlayerName('red', red.long);
                    const blueCountry = blue.country || blue.iocCode;
                    const redCountry = red.country || red.iocCode;
                    if (blueCountry) scoreboardInstance.updateCountry('blue', blueCountry);
                    if (redCountry) scoreboardInstance.updateCountry('red', redCountry);
                    break;
                }
                case 'match_config': {
                    const raw = parseMaybeJson(payload.raw_data);
                    const structured = payload.structured_data || payload;
                    const data = raw && typeof raw === 'object' ? raw : structured;
                    if (data) {
                        if (data.round_duration != null) {
                            const parsed = parseInt(data.round_duration, 10);
                            if (!Number.isNaN(parsed)) {
                                roundDuration = parsed;
                            }
                        }
                        if (typeof scoreboardInstance.updateMatchInfo === 'function') {
                            scoreboardInstance.updateMatchInfo(data.weight, data.division, data.category);
                        }
                        if (data.number && scoreboardInstance.svg) {
                            const element = scoreboardInstance.svg.getElementById('matchNumber');
                            if (element) {
                                element.textContent = `#${data.number}`;
                            }
                        }
                    }
                    break;
                }
                case 'current_scores': {
                    const parsedRaw = parseMaybeJson(payload.raw_data);
                    const source = parsedRaw && typeof parsedRaw === 'object' ? parsedRaw : payload;
                    const blueScore = source.athlete1_score ?? source?.athlete1?.score ?? 0;
                    const redScore = source.athlete2_score ?? source?.athlete2?.score ?? 0;
                    scoreboardInstance.updateScore('blue', blueScore);
                    scoreboardInstance.updateScore('red', redScore);
                    break;
                }
                case 'clock': {
                    if (payload.time) {
                        const t = parseTime(payload.time);
                        scoreboardInstance.updateTimer(t.minutes, t.seconds);
                    }
                    break;
                }
                case 'round': {
                    const round = payload.current_round ?? payload.round;
                    if (round != null) {
                        scoreboardInstance.updateRound(round);
                        const mins = Math.floor(roundDuration / 60);
                        const secs = roundDuration % 60;
                        scoreboardInstance.updateTimer(mins, secs);
                    }
                    break;
                }
                default: {
                    if (payload.time) {
                        const t = parseTime(payload.time);
                        scoreboardInstance.updateTimer(t.minutes, t.seconds);
                    }
                    break;
                }
            }
        }

        function teardownWebSocket() {
            if (!ws) return;
            ws.onopen = null;
            ws.onclose = null;
            ws.onerror = null;
            ws.onmessage = null;
            try {
                ws.close();
            } catch (_error) { }
            ws = null;
        }

        function scheduleReconnect() {
            if (retryCount >= MAX_RETRIES) {
                return;
            }
            retryCount += 1;
            window.setTimeout(connect, RETRY_DELAY_MS);
        }

        function connect() {
            teardownWebSocket();
            const url = resolveWebSocketUrl();

            try {
                ws = new WebSocket(url);
            } catch (_error) {
                updateConnectionStatus(false);
                scheduleReconnect();
                return;
            }

            ws.onopen = () => {
                retryCount = 0;
                updateConnectionStatus(true);
            };

            ws.onerror = () => {
                updateConnectionStatus(false);
            };

            ws.onclose = () => {
                updateConnectionStatus(false);
                scheduleReconnect();
            };

            ws.onmessage = (event) => {
                try {
                    const parsed = JSON.parse(event.data);
                    if (parsed?.type === 'pss_event') {
                        handle(parsed.data);
                    } else if (parsed?.type === 'connection') {
                        updateConnectionStatus(Boolean(parsed.connected));
                    }
                } catch (_error) { }
            };
        }

        function attachFallbackListeners() {
            window.addEventListener('pss-event', (event) => {
                if (event?.detail) {
                    handle(event.detail);
                }
            });

            window.addEventListener('storage', (event) => {
                if (event.key !== 'pss_event' || !event.newValue) {
                    return;
                }
                try {
                    const payload = JSON.parse(event.newValue);
                    if (payload?.type === 'pss_event') {
                        handle(payload.data ?? payload);
                    }
                } catch (_error) { }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const obj = document.getElementById('scoreboard-svg');
            if (window.ScoreboardFontInjector) {
                window.ScoreboardFontInjector.initForObject('#scoreboard-svg');
            }
            obj?.addEventListener('load', initialize);
            if (obj?.contentDocument) {
                initialize();
            }
            attachFallbackListeners();
            connect();
        });

        window.ModernScoreboard = {
            handle,
            reconnect: connect,
            resolveWebSocketUrl,
        };
    </script>
</body>

</html>
