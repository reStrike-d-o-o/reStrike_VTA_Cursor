openapi: 3.1.0
info:
  title: reStrike VTA External API
  version: "1.0.0"
  description: >
    Programmatic interface for reStrike VTA integrations. This schema can be edited from the
    desktop application. Validate every change before publishing to ensure interoperability.
servers:
  - url: http://127.0.0.1:8787/api
    description: Local development server
paths:
  /health:
    get:
      summary: API health check
      operationId: getHealth
      description: |
        Returns a simple status payload that clients can use to verify connectivity.
      responses:
        "200":
          description: Health status payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                required:
                  - status
                  - timestamp
components:
  schemas: {}
